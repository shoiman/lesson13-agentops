name: agent-evals

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  unit-tests:
    name: Unit & integration tests (no LLM)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-ci.txt
      - run: pytest -q

  eval-gate:
    name: Golden dataset eval + threshold gate
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUNBUFFERED: "1"          # лог eval-ів видно одразу, а не в кінці
      LLM_REQUEST_TIMEOUT: "60"
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.1-flash-lite' }}
      DISABLE_TRACING: "1"
      EVAL_ACCURACY_THRESHOLD: "0.85"
      EVAL_RELEVANCE_THRESHOLD: "0.90"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-ci.txt
      - name: Check secret
        run: test -n "$GOOGLE_API_KEY" || (echo "::error::Add GOOGLE_API_KEY in Settings → Secrets → Actions" && exit 1)
      - name: Run eval suite (fails the PR on regression)
        run: python evals/run_evals.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: results/eval_report.json
